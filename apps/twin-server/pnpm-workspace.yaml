# Standalone pnpm project (not part of a repo-wide workspace).
# The SimForge engine is consumed read-only from a pinned worktree via file:
# dependencies; overrides rewrite the engine's internal workspace:* edges to
# the same worktree so the graph resolves outside the engine monorepo.
packages: []
overrides:
  "@simforge/engine": "file:/home/path/worktrees/twinserver-engine/packages/engine"
  "@simforge/compiler": "file:/home/path/worktrees/twinserver-engine/packages/compiler"
  "@simforge/maps": "file:/home/path/worktrees/twinserver-engine/packages/maps"
  "@simforge/map-registry": "file:/home/path/worktrees/twinserver-engine/packages/map-registry"
  "@simforge/scenario": "file:/home/path/worktrees/twinserver-engine/packages/scenario"
  "@simforge/openscenario": "file:/home/path/worktrees/twinserver-engine/packages/openscenario"
  "@simforge/asset-catalog": "file:/home/path/worktrees/twinserver-engine/packages/asset-catalog"
  "@simforge/training-env": "file:/home/path/worktrees/twinserver-engine/packages/training-env"
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
