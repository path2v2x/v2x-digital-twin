map $http_upgrade $twin_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name twin.path2v2x.net;

    location ~ ^/(twin|drive|camera-feeds)$ {
        proxy_pass http://127.0.0.1:8865;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $twin_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /streams/ {
        proxy_pass http://127.0.0.1:8190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /map/ {
        alias /var/www/v2x-twin-map/;
        types {
            model/gltf-binary glb;
            image/ktx2 ktx2;
            application/json json;
        }
        gzip_static on;
        add_header Cache-Control "public, max-age=3600";
    }

    location = / {
        return 302 /dashboard/drive;
    }

    location / {
        proxy_pass http://127.0.0.1:5199;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $twin_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
