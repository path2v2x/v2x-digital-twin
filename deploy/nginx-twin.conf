# twin.path2v2x.net -> SimForge Studio Drive + V2X Digital Twin on path-rfs.
# Installed by scripts/deploy.sh to /etc/nginx/sites-available/v2x-twin (symlinked
# into sites-enabled). Port 80 and the certificate are handled by the drive repo
# (scripts/ops/nginx/acme-http.conf in path2v2x/v2x-drive).
map $http_upgrade $twin_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name twin.path2v2x.net;
    ssl_certificate /etc/letsencrypt/live/drive.path2v2x.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.path2v2x.net/privkey.pem;

    location ~ ^/(twin|drive|camera-feeds)$ {
        proxy_pass http://127.0.0.1:8865;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $twin_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /streams/ {
        proxy_pass http://127.0.0.1:8190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /camera/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_redirect / /camera/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }
    location /archive/ {
        proxy_pass http://127.0.0.1:9996/;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 3600s;
    }
    location /detections/ {
        proxy_pass http://127.0.0.1:8190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8190/health;
    }
    location /map/ {
        alias /var/www/v2x-twin-map/;
        types { model/gltf-binary glb; image/ktx2 ktx2; application/json json; application/gzip gz; image/webp webp; }
        add_header Cache-Control "public, max-age=3600";
    }
    location = / {
        return 302 /dashboard/drive;
    }
    location = /drive-rigs/richmond.json {
        alias /home/path/v2x-digital-twin/config/drive-rigs/richmond.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:5199;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $twin_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
